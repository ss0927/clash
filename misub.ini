[custom]
[custom]

; ==========================================================
; MiSub Clash 使用体验版
;
; 策略组保持原有设计，不新增 YouTube / TG / Emby /
; B站 / 游戏 / Google / 国外媒体 / 国外网站等策略组
;
; 分流逻辑：
; 1. 局域网 / 私有网络       → 🎯 全球直连
; 2. 国内网站 / 国内 IP      → 🎯 全球直连
; 3. 国内常用 App            → 🎯 全球直连
; 4. 微信 / 腾讯 / 阿里 / 百度 → 🎯 全球直连
; 5. AI                     → 🤖 AI
; 6. GFW 国外网站            → 🚀 节点选择
; 7. 未匹配流量              → 🐟 漏网之鱼
;
; 原有策略组全部保留
; ==========================================================


; ==========================================================
; ① 局域网 / 本地网络
; ==========================================================

ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list


; ==========================================================
; ② 国内直连基础规则
;
; 这里继续使用你原来的成熟规则集
; ==========================================================

ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaIp.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Download.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/SteamCN.list

; 中国大陆 IP 兜底
ruleset=🎯 全球直连,[]GEOIP,CN


; ==========================================================
; ③ 微信
;
; 单独放在腾讯规则前面
; 微信属于高优先级国内 App
; ==========================================================

ruleset=🎯 全球直连,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/WeChat/WeChat.list


; ==========================================================
; ④ 腾讯
;
; 防止微信 / QQ / 腾讯 CDN / 小程序等漏掉
; ==========================================================

ruleset=🎯 全球直连,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Tencent/Tencent.list


; ==========================================================
; ⑤ 阿里系
;
; 淘宝 / 天猫 / 支付宝 / 阿里云等
; ==========================================================

ruleset=🎯 全球直连,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Alibaba/Alibaba.list


; ==========================================================
; ⑥ 百度
; ==========================================================

ruleset=🎯 全球直连,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Baidu/Baidu.list


; ==========================================================
; ⑦ 华为 / 荣耀生态
;
; Android 手机系统服务、华为云等国内服务直连
; ==========================================================

ruleset=🎯 全球直连,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Huawei/Huawei.list


; ==========================================================
