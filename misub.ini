[custom]

; ==========================================================
; MiSub Clash / Mihomo
; 规则层优化版
; 9月10日
; 设计原则：
; 1. 不增加应用分流策略组
; 2. 国内 / 局域网优先直连
; 3. AI 独立分流
; 4. PT / BT / Tracker / 下载尽量直连
; 5. GEOSITE / GEOIP 为主
; 6. ACL4SSR 作为补漏
; 7. GFW 作为国外代理主要入口
; 8. FINAL 保留 🐟 漏网之鱼
;
; 当前策略组保持原样：
; 🚀 节点选择
; 🔴 手动选择
; ♻️ 自动选择
; 🤖 AI
; 🇸🇬 新加坡自动
; 🇺🇸 美国自动
; 🇫🇷 法国自动
; 🎯 全球直连
; 🐟 漏网之鱼
; ==========================================================


; ==========================================================
; ① 私有网络 / 局域网
; 优先级最高
; 防止 NAS / 软路由 / Docker / 局域网设备进入代理
; ==========================================================

ruleset=🎯 全球直连,[]GEOSITE,private
ruleset=🎯 全球直连,[]GEOIP,private,no-resolve

ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list


; ==========================================================
; ② Steam
;
; Steam 中国服务 → 直连
; Steam 国际服务 → 🚀 节点选择
;
; 必须放在 GEOSITE,cn / GEOIP,cn 之前
; 防止 Steam 国际 CDN / 图片资源被国内规则抢先匹配
; ==========================================================

; Steam 中国服务
ruleset=🎯 全球直连,[]GEOSITE,steam@cn

; Steam 国际服务 / CDN / 社区资源
ruleset=🚀 节点选择,[]GEOSITE,steam

; Steam CDN 补充
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,steamstatic.com
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,queniuqe.com

; ==========================================================
; ③ 国内直连
; GeoSite + GeoIP + ACL4SSR 三层覆盖
; ==========================================================

; Mihomo GeoSite 中国域名
ruleset=🎯 全球直连,[]GEOSITE,cn

; Mihomo GeoIP 中国地址
ruleset=🎯 全球直连,[]GEOIP,cn,no-resolve

; ACL4SSR 国内补漏
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaIp.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list

; ACL4SSR 国内白名单 / 防误代理
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list


; ==========================================================
; ④ 国内特殊服务
; ==========================================================

; Google 中国可用服务
ruleset=🎯 全球直连,[]GEOSITE,google-cn

; 中国区游戏
ruleset=🎯 全球直连,[]GEOSITE,category-games@cn


; ==========================================================
; ⑤ 下载 / BT / PT
;
; 这一部分对你的使用场景非常重要
;
; 防止：
; PT Tracker
; BT Tracker
; 下载服务
; 国内游戏平台下载
; 被 GFW 规则误判进入代理
; ==========================================================

; 公共 Tracker
ruleset=🎯 全球直连,[]GEOSITE,category-public-tracker

; 游戏平台下载
ruleset=🎯 全球直连,[]GEOSITE,category-game-platforms-download

; ACL4SSR 下载规则补漏
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Download.list


; ==========================================================
; ⑥ AI
;
; 先保留你原来的三个核心 AI 规则
; 再使用 category-ai-!cn 扩大覆盖
;
; 不增加任何 AI 策略组
; 全部进入现有 🤖 AI
; ==========================================================

ruleset=🤖 AI,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.list

ruleset=🤖 AI,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Gemini/Gemini.list

ruleset=🤖 AI,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Claude/Claude.list

; 非中国 AI 服务补充
ruleset=🤖 AI,[]GEOSITE,category-ai-!cn


; ==========================================================
; ⑦ 国外代理
;
; 第一层：
; Mihomo GeoSite GFW
;
; 第二层：
; ACL4SSR ProxyGFWlist 补漏
;
; 两层并存，不为了精简而牺牲覆盖率
; ==========================================================

ruleset=🚀 节点选择,[]GEOSITE,gfw

; ACL4SSR GFWList 补漏
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist.list


; ==========================================================
; ⑧ 最终兜底
;
; 没有匹配到任何规则的流量
; 交给你现有的 🐟 漏网之鱼
; 不改变你的策略组设计
; ==========================================================

ruleset=🐟 漏网之鱼,[]FINAL


; ==========================================================
; 🚀 节点选择
; ==========================================================

custom_proxy_group=🚀 节点选择`select`[]🔴 手动选择`[]♻️ 自动选择


; ==========================================================
; 🔴 手动选择
; ==========================================================

custom_proxy_group=🔴 手动选择`select`.*


; ==========================================================
; ♻️ 自动选择
; ==========================================================

custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50


; ==========================================================
; 🤖 AI
; ==========================================================

custom_proxy_group=🤖 AI`select`[]🇸🇬 新加坡自动`[]🇺🇸 美国自动`[]🇫🇷 法国自动`[]🔴 手动选择`[]🚀 节点选择


; ==========================================================
; 🇸🇬 新加坡自动
; ==========================================================

custom_proxy_group=🇸🇬 新加坡自动`url-test`(新加坡|坡|狮城|SG|Singapore)`http://www.gstatic.com/generate_204`300,,100


; ==========================================================
; 🇺🇸 美国自动
; ==========================================================

custom_proxy_group=🇺🇸 美国自动`url-test`(美国|美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States|America|California)`http://www.gstatic.com/generate_204`300,,100


; ==========================================================
; 🇫🇷 法国自动
; ==========================================================

custom_proxy_group=🇫🇷 法国自动`url-test`(法国|法兰西|巴黎|FR|France|Paris)`http://www.gstatic.com/generate_204`300,,100


; ==========================================================
; 🎯 全球直连
; ==========================================================

custom_proxy_group=🎯 全球直连`select`[]DIRECT


; ==========================================================
; 🐟 漏网之鱼
;
; 保持你原来的设计：
; 默认优先使用 🚀 节点选择
; 同时保留手动 / 自动 / DIRECT
; ==========================================================

custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]🔴 手动选择`[]♻️ 自动选择`[]DIRECT


; ==========================================================
; 规则生成
; ==========================================================

enable_rule_generator=true
overwrite_original_rules=true
